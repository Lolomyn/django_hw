{% extends 'base.html' %}

{% block title %}О продукте{% endblock %}

{% block content %}
    {% include 'header.html' %}
    <div class="container mt-5">
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-4">
                    <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.description }}</p>
                        <p class="card-text"><small class="text-body-secondary">{{ product.price }} ₽</small></p>
                        <p class="card-text text-end"><small
                                class="text-body-tertiary">{{ product.category.name }}</small></p>
                    </div>
                </div>
            </div>
        </div>
         <a class="btn btn-primary" href="javascript:history.back()">←</a>


        {% include 'footer.html' %}
    </div>
{% endblock %}
