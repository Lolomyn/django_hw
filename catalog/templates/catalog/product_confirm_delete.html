{% extends 'catalog/base.html' %}

{% block title %}Форма продукта{% endblock %}

{% block content %}
    {% include 'catalog/header.html' %}
    <div class="container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <p class="card-text">Уверены, что хотите удалить продукт {{ object.name }}?</p>
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отменить</a>
        </form>
    </div>

{% endblock %}
