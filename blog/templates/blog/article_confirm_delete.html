{% extends 'blog/base.html' %}

{% block title %}Форма книги{% endblock %}

{% block content %}
    {% include 'blog/header.html' %}
    <div class="container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <p class="card-text">Уверены, что хотите удалить статью {{ object.title }}?</p>
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blog:article_list' %}" class="btn btn-secondary">Отменить</a>
        </form>
    </div>

{% endblock %}
