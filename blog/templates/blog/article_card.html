<div class="card ms-3 mt-3" style="width: 25rem;">
    <img src="{{ article.preview.url }}" class="card-img-top" alt="{{ article.title }}" style="height: 15rem;">
    <div class="card-body">
        <p class="card-text"><small class="text-muted">{{ article.created_at }}</small></p>
        <h6 class="card-title">{{ article.title }}</h6>
        <p class="card-subtitle mt-3 mb-2 text-muted">{{ article.content|truncatechars:100 }}</p>
        <a href="{% url 'blog:article_detail' article.pk %}" class="btn btn-primary">Читать</a>
    </div>
</div>
